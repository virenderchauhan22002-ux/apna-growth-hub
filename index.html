<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apna Growth Hub - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #ffffff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: white;
            padding: 25px;
            border-radius: 22px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            font-size: 45px;
            margin-bottom: 5px;
        }

        h1 {
            text-align: center;
            color: #1565c0;
            margin: 5px 0;
            font-size: 27px;
        }

        .tagline {
            text-align: center;
            color: #555;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #bbb;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #1565c0;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0d47a1;
        }

        .save-button {
            background: #2e7d32;
        }

        .save-button:hover {
            background: #1b5e20;
        }

        .login-button {
            background: #1565c0;
        }

        .signup-button {
            background: #6a1b9a;
        }

        .note {
            margin-top: 18px;
            padding: 12px;
            background: #fff8e1;
            border-radius: 10px;
            color: #6d4c41;
            font-size: 14px;
            line-height: 1.5;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .success {
            display: block;
            background: #e8f5e9;
            color: #1b5e20;
        }

        .error {
            display: block;
            background: #ffebee;
            color: #b71c1c;
        }

        .divider {
            text-align: center;
            margin: 20px 0 5px;
            color: #777;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">🚀</div>

        <h1>Apna Growth Hub</h1>

        <div class="tagline">
            Learn • Grow • Succeed
        </div>

        <form id="customerForm">

            <label for="customerName">
                पूरा नाम
            </label>

            <input
                type="text"
                id="customerName"
                placeholder="अपना नाम लिखें"
                required
            >

            <label for="customerMobile">
                मोबाइल नंबर
            </label>

            <input
                type="tel"
                id="customerMobile"
                placeholder="10 अंकों का मोबाइल नंबर"
                maxlength="10"
                required
            >

            <label for="customerDob">
                Date of Birth
            </label>

            <input
                type="date"
                id="customerDob"
                required
            >

            <label for="customerEmail">
                Email Address
            </label>

            <input
                type="email"
                id="customerEmail"
                placeholder="example@gmail.com"
                required
            >

            <label for="customerPassword">
                Password
            </label>

            <input
                type="password"
                id="customerPassword"
                placeholder="कम से कम 6 characters"
                minlength="6"
                required
            >

            <button
                type="submit"
                class="save-button"
            >
                जानकारी Save करें
            </button>

        </form>

        <div class="divider">
            Account Login / Signup
        </div>

        <button
            id="loginButton"
            class="login-button"
        >
            Login करें
        </button>

        <button
            id="signupButton"
            class="signup-button"
        >
            नया Account बनाएँ
        </button>

        <div id="messageBox" class="message"></div>

        <div class="note">
            अब OTP की जरूरत नहीं है। Email और Password से login करें।
            Password किसी के साथ share न करें।
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

    <script>

        const firebaseConfig = {
            apiKey: "AIzaSyBasu6SpOqvldxWEmTHs9WUSTXsK2qz-0w",
            authDomain: "apna-growth-hub.firebaseapp.com",
            projectId: "apna-growth-hub",
            storageBucket: "apna-growth-hub.firebasestorage.app",
            messagingSenderId: "939001251123",
            appId: "1:939001251123:web:f2966004acaa64186e2a46",
            measurementId: "G-GZGCHL4XQ3"
        };

        firebase.initializeApp(firebaseConfig);

        const auth = firebase.auth();

        const customerForm =
            document.getElementById("customerForm");

        const loginButton =
            document.getElementById("loginButton");

        const signupButton =
            document.getElementById("signupButton");

        const messageBox =
            document.getElementById("messageBox");


        function showMessage(message, type) {

            messageBox.innerText = message;

            messageBox.className =
                "message " + type;

        }


        function calculateAge(dateOfBirth) {

            const birthDate =
                new Date(dateOfBirth);

            const today =
                new Date();

            let age =
                today.getFullYear() -
                birthDate.getFullYear();

            const monthDifference =
                today.getMonth() -
                birthDate.getMonth();

            if (
                monthDifference < 0 ||
                (
                    monthDifference === 0 &&
                    today.getDate() < birthDate.getDate()
                )
            ) {
                age--;
            }

            return age;

        }


        function getCustomerDetails() {

            const customerName =
                document.getElementById("customerName")
                    .value.trim();

            const customerMobile =
                document.getElementById("customerMobile")
                    .value.trim();

            const customerDob =
                document.getElementById("customerDob")
                    .value;

            const customerEmail =
                document.getElementById("customerEmail")
                    .value.trim();

            const customerPassword =
                document.getElementById("customerPassword")
                    .value;

            if (customerName === "") {

                showMessage(
                    "कृपया अपना नाम भरें।",
                    "error"
                );

                return null;

            }

            if (!/^[0-9]{10}$/.test(customerMobile)) {

                showMessage(
                    "कृपया सही 10 अंकों का मोबाइल नंबर भरें।",
                    "error"
                );

                return null;

            }

            if (customerDob === "") {

                showMessage(
                    "कृपया Date of Birth भरें।",
                    "error"
                );

                return null;

            }

            if (customerEmail === "") {

                showMessage(
                    "कृपया Email भरें।",
                    "error"
                );

                return null;

            }

            if (customerPassword.length < 6) {

                showMessage(
                    "Password कम से कम 6 characters का होना चाहिए।",
                    "error"
                );

                return null;

            }

            const customerAge =
                calculateAge(customerDob);

            if (
                customerAge < 0 ||
                customerAge > 120
            ) {

                showMessage(
                    "कृपया सही Date of Birth भरें।",
                    "error"
                );

                return null;

            }

            return {
                customerName,
                customerMobile,
                customerDob,
                customerAge,
                customerEmail,
                customerPassword
            };

        }


        function saveCustomerDetails(details) {

            localStorage.setItem(
                "customerName",
                details.customerName
            );

            localStorage.setItem(
                "customerMobile",
                details.customerMobile
            );

            localStorage.setItem(
                "customerDob",
                details.customerDob
            );

            localStorage.setItem(
                "customerAge",
                details.customerAge
            );

            localStorage.setItem(
                "customerEmail",
                details.customerEmail
            );

        }


        customerForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();

                const details =
                    getCustomerDetails();

                if (!details) {
                    return;
                }

                saveCustomerDetails(details);

                showMessage(
                    "आपकी जानकारी Save हो गई है। अब Login या नया Account बनाएँ।",
                    "success"
                );

            }
        );


        signupButton.addEventListener(
            "click",
            async function() {

                const details =
                    getCustomerDetails();

                if (!details) {
                    return;
                }

                try {

                    const result =
                        await auth.createUserWithEmailAndPassword(
                            details.customerEmail,
                            details.customerPassword
                        );

                    saveCustomerDetails(details);

                    showMessage(
                        "नया Account बन गया है। Dashboard खुल रहा है...",
                        "success"
                    );

                    setTimeout(function() {

                        window.location.href =
                            "dashboard.html";

                    }, 1000);

                } catch (error) {

                    console.error(error);

                    if (
                        error.code ===
                        "auth/email-already-in-use"
                    ) {

                        showMessage(
                            "यह Email पहले से registered है। Login करें।",
                            "error"
                        );

                    } else if (
                        error.code ===
                        "auth/invalid-email"
                    ) {

                        showMessage(
                            "Email सही नहीं है।",
                            "error"
                        );

                    } else if (
                        error.code ===
                        "auth/weak-password"
                    ) {

                        showMessage(
                            "Password कमजोर है। कम से कम 6 characters रखें।",
                            "error"
                        );

                    } else {

                        showMessage(
                            "Account नहीं बन पाया: " +
                            error.message,
                            "error"
                        );

                    }

                }

            }
        );


        loginButton.addEventListener(
            "click",
            async function() {

                const details =
                    getCustomerDetails();

                if (!details) {
                    return;
                }

                try {

                    const result =
                        await auth.signInWithEmailAndPassword(
                            details.customerEmail,
                            details.customerPassword
                        );

                    saveCustomerDetails(details);

                    showMessage(
                        "Login सफल हो गया। Dashboard खुल रहा है...",
                        "success"
                    );

                    setTimeout(function() {

                        window.location.href =
                            "dashboard.html";

                    }, 1000);

                } catch (error) {

                    console.error(error);

                    if (
                        error.code ===
                        "auth/invalid-credential"
                    ) {

                        showMessage(
                            "Email या Password गलत है।",
                            "error"
                        );

                    } else if (
                        error.code ===
                        "auth/user-not-found"
                    ) {

                        showMessage(
                            "यह Email registered नहीं है। पहले नया Account बनाएँ।",
                            "error"
                        );

                    } else if (
                        error.code ===
                        "auth/wrong-password"
                    ) {

                        showMessage(
                            "Password गलत है।",
                            "error"
                        );

                    } else {

                        showMessage(
                            "Login नहीं हो पाया: " +
                            error.message,
                            "error"
                        );

                    }

                }

            }
        );

    </script>

</body>

</html>
