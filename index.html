  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f9ff;
      color: #172033;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .page {
      width: 100%;
      max-width: 430px;
    }

    .login-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 30px 26px 28px;
      box-shadow: 0 12px 40px rgba(20, 76, 150, 0.12);
      border: 1px solid #e7eef8;
    }

    .brand {
      text-align: center;
      margin-bottom: 18px;
    }

    .brand-logo {
      width: 165px;
      height: 165px;
      object-fit: contain;
      object-position: center;
      display: block;
      margin: 0 auto;
    }

    .welcome {
      text-align: center;
      margin-bottom: 24px;
    }

    .welcome h1 {
      font-size: 26px;
      color: #172033;
      margin-bottom: 7px;
    }

    .welcome p {
      font-size: 14px;
      color: #748096;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #37445a;
      margin-bottom: 7px;
    }

    .input-box {
      position: relative;
    }

    .input-box input,
    .input-box select {
      width: 100%;
      height: 50px;
      border: 1px solid #dce5f0;
      border-radius: 13px;
      padding: 0 15px;
      font-size: 15px;
      outline: none;
      background: #fbfdff;
      color: #172033;
      transition: 0.2s;
    }

    .input-box input:focus,
    .input-box select:focus {
      border-color: #1671df;
      box-shadow: 0 0 0 3px rgba(22, 113, 223, 0.09);
      background: #ffffff;
    }

    .password-input {
      padding-right: 48px !important;
    }

    .password-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 19px;
      color: #68758a;
      padding: 4px;
    }

    .forgot-row {
      display: flex;
      justify-content: flex-end;
      margin-top: -4px;
      margin-bottom: 18px;
    }

    .forgot-btn {
      border: none;
      background: none;
      color: #1269d3;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary-btn {
      width: 100%;
      height: 51px;
      border: none;
      border-radius: 13px;
      background: linear-gradient(135deg, #1269d3, #0b55b4);
      color: white;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(18, 105, 211, 0.20);
      transition: 0.2s;
    }

    .primary-btn:hover {
      transform: translateY(-1px);
    }

    .switch-area {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #718096;
    }

    .switch-btn {
      border: none;
      background: transparent;
      color: #1269d3;
      font-weight: 800;
      cursor: pointer;
      margin-left: 4px;
    }

    .message {
      display: none;
      padding: 11px 13px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 13px;
      text-align: center;
    }

    .message.success {
      display: block;
      background: #eafaf2;
      color: #137548;
      border: 1px solid #bfead2;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #c62828;
      border: 1px solid #ffd0d0;
    }

    #signupBox {
      display: none;
    }

    .small-note {
      text-align: center;
      margin-top: 18px;
      font-size: 11px;
      line-height: 1.5;
      color: #8a95a6;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      .login-card {
        padding: 25px 19px 23px;
        border-radius: 20px;
      }

      .brand-logo {
        width: 145px;
        height: 145px;
      }

      .welcome h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

      <div id="loginBox">
        <div class="welcome">
          <h1>Welcome Back</h1>
          <p>Login to continue your growth journey</p>
        </div>

        <div id="loginMessage" class="message"></div>

        <form onsubmit="loginAccount(event)">
          <div class="form-group">
            <label for="loginEmail">Email Address</label>
            <div class="input-box">
              <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                autocomplete="email"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="loginPassword">Password</label>
            <div class="input-box">
              <input
                type="password"
                id="loginPassword"
                class="password-input"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="password-toggle"
                onclick="togglePassword('loginPassword', this)"
                aria-label="Show password"
              >👁</button>
            </div>
          </div>

          <div class="forgot-row">
            <button type="button" class="forgot-btn" onclick="forgotPassword()">
              Forgot Password?
            </button>
          </div>

          <button type="submit" class="primary-btn">Login</button>
        </form>

        <div class="switch-area">
          Don't have an account?
          <button type="button" class="switch-btn" onclick="showSignup()">
            Create New Account
          </button>
        </div>
      </div>

      <div id="signupBox">
        <div class="welcome">
          <h1>Create Account</h1>
          <p>Start your growth journey with us</p>
        </div>

        <div id="signupMessage" class="message"></div>

        <form onsubmit="createAccount(event)">
          <div class="form-group">
            <label for="signupName">Full Name</label>
            <div class="input-box">
              <input
                type="text"
                id="signupName"
                placeholder="Enter your full name"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="signupMobile">Mobile Number</label>
            <div class="input-box">
              <input
                type="tel"
                id="signupMobile"
                placeholder="Enter mobile number"
                maxlength="10"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="signupDob">Date of Birth</label>
            <div class="input-box">
              <input type="date" id="signupDob" required />
            </div>
          </div>

          <div class="form-group">
            <label for="signupEmail">Email Address</label>
            <div class="input-box">
              <input
                type="email"
                id="signupEmail"
                placeholder="Enter your email"
                autocomplete="email"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="signupPassword">Password</label>
            <div class="input-box">
              <input
                type="password"
                id="signupPassword"
                class="password-input"
                placeholder="Create a password"
                autocomplete="new-password"
                required
              />
              <button
                type="button"
                class="password-toggle"
                onclick="togglePassword('signupPassword', this)"
                aria-label="Show password"
              >👁</button>
            </div>
          </div>

          <button type="submit" class="primary-btn">Create Account</button>
        </form>

        <div class="switch-area">
          Already have an account?
          <button type="button" class="switch-btn" onclick="showLogin()">
            Login
          </button>
        </div>
      </div>

    function showMessage(elementId, message, type) {

      element.textContent = message;
      element.className = "message " + type;
    }

    function clearMessages() {
      document.getElementById("loginMessage").className = "message";
      document.getElementById("loginMessage").textContent = "";

      document.getElementById("signupMessage").className = "message";
      document.getElementById("signupMessage").textContent = "";

      clearMessages();
      document.getElementById("loginBox").style.display = "block";
      document.getElementById("signupBox").style.display = "none";

    function showSignup() {
      clearMessages();
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("signupBox").style.display = "block";
    }

    function togglePassword(inputId, button) {
      const input = document.getElementById(inputId);

      if (input.type === "password") {
        input.type = "text";
        button.textContent = "🙈";
      } else {
        input.type = "password";
        button.textContent = "👁";
      }
    }

    function calculateAge(dateOfBirth) {
      const today = new Date();
      const birthDate = new Date(dateOfBirth);

      let age =
        today.getFullYear() -
        birthDate.getFullYear();

      const monthDifference =
        today.getMonth() -
        birthDate.getMonth();

      if (
        monthDifference < 0 ||
        (
          monthDifference === 0 &&
          today.getDate() < birthDate.getDate()
        )
      ) {
        age--;
      }

      return age;
    }

    function getReferralCode() {
      const params =
        new URLSearchParams(window.location.search);

      const ref = params.get("ref");

      if (ref) {
        localStorage.setItem("referralCode", ref);
        return ref;
      }

      return localStorage.getItem("referralCode") || "";
    }

    async function saveCustomerProfile(
      user,
      fullName,
      mobile,
      dob,
      age,
      referralCode
    ) {
      const customerData = {
        uid: user.uid,
        fullName: fullName,
        mobile: mobile,
        dob: dob,
        age: age,
        email: user.email,
        referralCode: referralCode,
        updatedAt:
          firebase.firestore.FieldValue.serverTimestamp()
      };

      await db
        .collection("customers")
        .doc(user.uid)
        .set(customerData, { merge: true });

      localStorage.setItem("customerName", fullName);
      localStorage.setItem("customerMobile", mobile);
      localStorage.setItem("customerEmail", user.email);
      localStorage.setItem("customerAge", age);
      localStorage.setItem("firebaseLoggedIn", "true");
    }

    async function createAccount(event) {
      event.preventDefault();

      const fullName =
        document.getElementById("signupName").value.trim();

      const mobile =
        document.getElementById("signupMobile").value.trim();

      const dob =
        document.getElementById("signupDob").value;

      const email =
        document.getElementById("signupEmail").value.trim();

      const password =
        document.getElementById("signupPassword").value;

      if (!fullName || !mobile || !dob || !email || !password) {
        showMessage(
          "signupMessage",
          "Please fill all details.",
          "error"
        );
        return;
      }

      if (!/^[0-9]{10}$/.test(mobile)) {
        showMessage(
          "signupMessage",
          "Please enter a valid 10 digit mobile number.",
          "error"
        );
        return;
      }

      const age = calculateAge(dob);

      if (age < 13) {
        showMessage(
          "signupMessage",
          "Minimum age required is 13 years.",
          "error"
        );
        return;
      }

      try {
        showMessage(
          "signupMessage",
          "Creating your account...",
          "success"
        );

        const userCredential =
          await auth.createUserWithEmailAndPassword(
            email,
            password
          );

        const user = userCredential.user;

        const referralCode = getReferralCode();

        await saveCustomerProfile(
          user,
          fullName,
          mobile,
          dob,
          age,
          referralCode
        );

        showMessage(
          "signupMessage",
          "Account created successfully!",
          "success"
        );

        setTimeout(function() {
          window.location.href = "dashboard.html";
        }, 1000);

      } catch (error) {
        let message = "Unable to create account.";

        if (error.code === "auth/email-already-in-use") {
          message = "This email is already registered.";
        } else if (error.code === "auth/weak-password") {
          message = "Password should be at least 6 characters.";
        } else if (error.code === "auth/invalid-email") {
          message = "Please enter a valid email address.";
        } else if (error.message) {
          message = error.message;
        }

        showMessage(
          "signupMessage",
          message,
          "error"
        );
      }
    }

    async function loginAccount(event) {
      event.preventDefault();

      const email =
        document.getElementById("loginEmail").value.trim();

      const password =
        document.getElementById("loginPassword").value;

      if (!email || !password) {
        showMessage(
          "loginMessage",
          "Please enter email and password.",
          "error"
        );
        return;
      }

      try {
        showMessage(
          "loginMessage",
          "Logging in...",
          "success"
        );

        const userCredential =
          await auth.signInWithEmailAndPassword(
            email,
            password
          );

        const user = userCredential.user;

        localStorage.setItem(
          "firebaseLoggedIn",
          "true"
        );

        localStorage.setItem(
          "customerEmail",
          user.email
        );

        try {
          const doc =
            await db
              .collection("customers")
              .doc(user.uid)
              .get();

          if (doc.exists) {
            const data = doc.data();

            if (data.fullName) {
              localStorage.setItem(
                "customerName",
                data.fullName
              );
            }

            if (data.mobile) {
              localStorage.setItem(
                "customerMobile",
                data.mobile
              );
            }

            if (data.age !== undefined) {
              localStorage.setItem(
                "customerAge",
                data.age
              );
            }
          }
        } catch (firestoreError) {
          console.log(
            "Profile fetch error:",
            firestoreError
          );
        }

        window.location.href = "dashboard.html";

      } catch (error) {
        let message = "Login failed.";

        if (error.code === "auth/user-not-found") {
          message = "No account found with this email.";
        } else if (error.code === "auth/wrong-password") {
          message = "Incorrect password.";
        } else if (error.code === "auth/invalid-credential") {
          message = "Invalid email or password.";
        } else if (error.code === "auth/too-many-requests") {
          message =
            "Too many attempts. Please try again later.";
        } else if (error.message) {
          message = error.message;
        }

        showMessage(
          "loginMessage",
          message,
          "error"
        );
      }
    }

    async function forgotPassword() {
      const email =
        document.getElementById("loginEmail").value.trim();

      if (!email) {
        showMessage(
          "loginMessage",
          "Enter your email first.",
          "error"
        );
        return;
      }

      try {
        await auth.sendPasswordResetEmail(email);

        showMessage(
          "loginMessage",
          "Password reset link sent to your email.",
          "success"
        );

      } catch (error) {
        let message =
          "Unable to send reset email.";

        if (error.code === "auth/user-not-found") {
          message =
            "No account found with this email.";
        } else if (error.message) {
          message = error.message;
        }

        showMessage(
          "loginMessage",
          message,
          "error"
        );
      }
    }

    document.addEventListener(
      "DOMContentLoaded",
      function() {
        getReferralCode();
        showLogin();
      }
    );
  </script>

</body>
