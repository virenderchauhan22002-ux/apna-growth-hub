<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Panel - Apna Growth Hub</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #eef4ff, #f8fbff);
      min-height: 100vh;
      color: #172033;
    }

    .header {
      background: linear-gradient(135deg, #123c91, #1769e0);
      color: white;
      padding: 25px 18px;
      text-align: center;
      border-radius: 0 0 28px 28px;
    }

    .header h1 {
      font-size: 27px;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .container {
      width: 94%;
      max-width: 1150px;
      margin: 25px auto;
    }

    .login-box,
    .admin-box {
      background: white;
      padding: 25px;
      border-radius: 22px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    .login-box {
      max-width: 430px;
      margin: 40px auto;
    }

    h2 {
      color: #123c91;
      margin-bottom: 18px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d9e1ef;
      border-radius: 10px;
      margin-bottom: 13px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #1769e0;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary-btn {
      width: 100%;
      background: #1769e0;
      color: white;
    }

    .primary-btn:hover {
      background: #123c91;
    }

    .logout-btn {
      background: #d93025;
      color: white;
    }

    .dashboard-btn {
      background: #123c91;
      color: white;
    }

    .message {
      margin-top: 12px;
      color: #d93025;
      font-size: 14px;
      line-height: 1.5;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .count-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .count-card {
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.07);
      border-left: 5px solid #1769e0;
    }

    .count-card h3 {
      font-size: 14px;
      color: #555;
      margin-bottom: 10px;
    }

    .count-number {
      font-size: 32px;
      font-weight: bold;
      color: #123c91;
    }

    .pending {
      border-left-color: #f59e0b;
    }

    .pending .count-number {
      color: #d97706;
    }

    .contacted {
      border-left-color: #2563eb;
    }

    .contacted .count-number {
      color: #2563eb;
    }

    .completed {
      border-left-color: #16a34a;
    }

    .completed .count-number {
      color: #16a34a;
    }

    .search-box {
      margin-bottom: 20px;
    }

    .inquiry-list {
      display: grid;
      gap: 18px;
    }

    .inquiry-card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.07);
      border: 1px solid #e7edf7;
    }

    .inquiry-card h3 {
      color: #123c91;
      margin-bottom: 12px;
    }

    .inquiry-card p {
      margin-bottom: 8px;
      color: #444;
      line-height: 1.5;
      word-break: break-word;
    }

    .inquiry-card strong {
      color: #172033;
    }

    .status-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .status-row select {
      width: auto;
      min-width: 150px;
      margin-bottom: 0;
    }

    .save-btn {
      background: #1769e0;
      color: white;
    }

    .whatsapp-btn {
      background: #16a34a;
      color: white;
    }

    .delete-btn {
      background: #d93025;
      color: white;
    }

    .empty {
      background: white;
      padding: 25px;
      border-radius: 18px;
      text-align: center;
      color: #666;
    }

    .hidden {
      display: none !important;
    }

    .footer {
      text-align: center;
      color: #777;
      font-size: 13px;
      padding: 25px 10px;
    }

    @media (max-width: 550px) {
      .header h1 {
        font-size: 23px;
      }

      .login-box,
      .admin-box {
        padding: 20px;
      }

      .status-row {
        align-items: stretch;
        flex-direction: column;
      }

      .status-row select,
      .status-row button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Apna Growth Hub 🔐</h1>
    <p>Admin Panel | Virender Chauhan</p>
  </div>

  <div class="container">

    <!-- ADMIN LOGIN -->
    <div class="login-box" id="loginSection">

      <h2>Admin Login</h2>

      <input
        type="email"
        id="adminEmail"
        placeholder="Admin Email"
      >

      <input
        type="password"
        id="adminPassword"
        placeholder="Admin Password"
      >

      <button class="primary-btn" id="loginBtn">
        Login to Admin Panel
      </button>

      <p class="message" id="loginMessage"></p>

    </div>

    <!-- ADMIN PANEL -->
    <div class="admin-box hidden" id="adminSection">

      <div class="top-bar">
        <div>
          <h2>Customer Inquiries</h2>
          <p>सभी customer inquiries यहाँ manage करें।</p>
        </div>

        <div class="top-actions">
          <button class="dashboard-btn" id="dashboardBtn">
            Dashboard
          </button>

          <button class="logout-btn" id="logoutBtn">
            Logout
          </button>
        </div>
      </div>

      <div class="count-grid">

        <div class="count-card">
          <h3>Total Inquiries</h3>
          <div class="count-number" id="totalCount">0</div>
        </div>

        <div class="count-card pending">
          <h3>Pending</h3>
          <div class="count-number" id="pendingCount">0</div>
        </div>

        <div class="count-card contacted">
          <h3>Contacted</h3>
          <div class="count-number" id="contactedCount">0</div>
        </div>

        <div class="count-card completed">
          <h3>Completed</h3>
          <div class="count-number" id="completedCount">0</div>
        </div>

      </div>

      <input
        class="search-box"
        type="text"
        id="searchInput"
        placeholder="Name, mobile, plan या question से search करें..."
      >

      <div class="inquiry-list" id="inquiryList"></div>

    </div>

  </div>

  <div class="footer">
    © 2026 Apna Growth Hub | Virender Chauhan
  </div>

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getFirestore,
      collection,
      getDocs,
      updateDoc,
      deleteDoc,
      doc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBasu6SpOqvldxWEmTHs9WUSTXsK2qz-0w",
      authDomain: "apna-growth-hub.firebaseapp.com",
      projectId: "apna-growth-hub",
      storageBucket: "apna-growth-hub.firebasestorage.app",
      messagingSenderId: "939001251123",
      appId: "1:939001251123:web:f2966004acaa64186e2a46",
      measurementId: "G-GZGCHL4XQ3"
    };

    const ADMIN_UID = "bhpu24P8Ixfq0ZPSBsoLW3kd0dg1";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginSection = document.getElementById("loginSection");
    const adminSection = document.getElementById("adminSection");
    const loginMessage = document.getElementById("loginMessage");
    const inquiryList = document.getElementById("inquiryList");
    const searchInput = document.getElementById("searchInput");

    let allInquiries = [];

    /*
      SECURITY CHECK

      अगर customer पहले से login है और Admin Panel खोलता है,
      तो उसे Admin Panel access नहीं मिलेगा।
      उसे logout करके Admin Login screen दिखाई जाएगी।
    */

    onAuthStateChanged(auth, async (user) => {

      if (!user) {
        showLogin();
        return;
      }

      if (user.uid !== ADMIN_UID) {

        await signOut(auth);

        showLogin();

        loginMessage.textContent =
          "यहाँ केवल Admin login कर सकता है। Customer account से access नहीं मिलेगा।";

        return;
      }

      showAdmin();
      await loadInquiries();

    });

    function showLogin() {
      loginSection.classList.remove("hidden");
      adminSection.classList.add("hidden");
    }

    function showAdmin() {
      loginSection.classList.add("hidden");
      adminSection.classList.remove("hidden");
    }

    document.getElementById("loginBtn").addEventListener("click", async () => {

      const email = document.getElementById("adminEmail").value.trim();
      const password = document.getElementById("adminPassword").value;

      loginMessage.textContent = "";

      if (!email || !password) {
        loginMessage.textContent =
          "Email और password दोनों भरें।";
        return;
      }

      try {

        const result = await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        if (result.user.uid !== ADMIN_UID) {

          await signOut(auth);

          loginMessage.textContent =
            "यह account Admin नहीं है। केवल Admin account से login करें।";

          return;
        }

        loginMessage.textContent = "";

      } catch (error) {

        console.error(error);

        loginMessage.textContent =
          "Admin login नहीं हुआ। Email या password check करें।";

      }

    });

    async function loadInquiries() {

      inquiryList.innerHTML = "";

      try {

        const snapshot =
          await getDocs(collection(db, "inquiries"));

        allInquiries = [];

        snapshot.forEach((item) => {

          allInquiries.push({
            id: item.id,
            ...item.data()
          });

        });

        updateCounts();
        displayInquiries(allInquiries);

      } catch (error) {

        console.error("Load inquiries error:", error);

        inquiryList.innerHTML = "";

        const errorBox = document.createElement("div");
        errorBox.className = "empty";
        errorBox.textContent =
          "Inquiries load नहीं हो पाईं। Firestore rules check करें।";

        inquiryList.appendChild(errorBox);

      }

    }

    function updateCounts() {

      let total = allInquiries.length;
      let pending = 0;
      let contacted = 0;
      let completed = 0;

      allInquiries.forEach((item) => {

        const status = item.status || "Pending";

        if (status === "Pending") {
          pending++;
        }

        if (status === "Contacted") {
          contacted++;
        }

        if (status === "Completed") {
          completed++;
        }

      });

      document.getElementById("totalCount").textContent = total;
      document.getElementById("pendingCount").textContent = pending;
      document.getElementById("contactedCount").textContent = contacted;
      document.getElementById("completedCount").textContent = completed;

    }

    function displayInquiries(inquiries) {

      inquiryList.innerHTML = "";

      if (inquiries.length === 0) {

        const emptyBox = document.createElement("div");
        emptyBox.className = "empty";
        emptyBox.textContent = "कोई inquiry नहीं मिली।";

        inquiryList.appendChild(emptyBox);
        return;

      }

      inquiries.forEach((item) => {

        const card = document.createElement("div");
        card.className = "inquiry-card";

        const title = document.createElement("h3");
        title.textContent =
          item.name || item.customerName || "Unknown Customer";

        const mobile = document.createElement("p");
        mobile.innerHTML =
          "<strong>Mobile:</strong> " +
          (item.mobile || item.phone || "Not available");

        const plan = document.createElement("p");
        plan.innerHTML =
          "<strong>Plan:</strong> " +
          (item.plan || item.selectedPlan || "Not selected");

        const question = document.createElement("p");
        question.innerHTML =
          "<strong>Question:</strong> " +
          (item.question || item.message || "No question");

        const date = document.createElement("p");
        date.innerHTML =
          "<strong>Date:</strong> " +
          (item.date || item.createdAt || "Not available");

        const statusText = item.status || "Pending";

        const statusRow = document.createElement("div");
        statusRow.className = "status-row";

        const statusSelect = document.createElement("select");

        const statuses = [
          "Pending",
          "Contacted",
          "Completed"
        ];

        statuses.forEach((status) => {

          const option = document.createElement("option");
          option.value = status;
          option.textContent = status;

          if (status === statusText) {
            option.selected = true;
          }

          statusSelect.appendChild(option);

        });

        const saveButton = document.createElement("button");
        saveButton.className = "save-btn";
        saveButton.textContent = "Save Status";

        saveButton.addEventListener("click", async () => {

          try {

            await updateDoc(
              doc(db, "inquiries", item.id),
              {
                status: statusSelect.value
              }
            );

            item.status = statusSelect.value;

            updateCounts();

            alert("Status saved successfully.");

          } catch (error) {

            console.error(error);
            alert("Status save नहीं हुआ।");

          }

        });

        const whatsappButton = document.createElement("button");
        whatsappButton.className = "whatsapp-btn";
        whatsappButton.textContent = "WhatsApp Customer";

        whatsappButton.addEventListener("click", () => {

          let mobileNumber =
            String(item.mobile || item.phone || "").replace(/\D/g, "");

          if (mobileNumber.length === 10) {
            mobileNumber = "91" + mobileNumber;
          }

          if (!mobileNumber) {
            alert("Customer mobile number उपलब्ध नहीं है।");
            return;
          }

          const customerName =
            item.name || item.customerName || "Customer";

          const message =
            "नमस्ते " +
            customerName +
            " जी, Apna Growth Hub से आपकी LIC inquiry के संबंध में संपर्क कर रहा हूँ।";

          const whatsappUrl =
            "https://wa.me/" +
            mobileNumber +
            "?text=" +
            encodeURIComponent(message);

          window.open(whatsappUrl, "_blank");

        });

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-btn";
        deleteButton.textContent = "Delete Inquiry";

        deleteButton.addEventListener("click", async () => {

          const confirmDelete = confirm(
            "क्या आप इस inquiry को delete करना चाहते हैं?"
          );

          if (!confirmDelete) {
            return;
          }

          try {

            await deleteDoc(
              doc(db, "inquiries", item.id)
            );

            await loadInquiries();

          } catch (error) {

            console.error(error);
            alert("Inquiry delete नहीं हुई।");

          }

        });

        statusRow.appendChild(statusSelect);
        statusRow.appendChild(saveButton);
        statusRow.appendChild(whatsappButton);
        statusRow.appendChild(deleteButton);

        card.appendChild(title);
        card.appendChild(mobile);
        card.appendChild(plan);
        card.appendChild(question);
        card.appendChild(date);
        card.appendChild(statusRow);

        inquiryList.appendChild(card);

      });

    }

    searchInput.addEventListener("input", () => {

      const searchText =
        searchInput.value.toLowerCase().trim();

      const filtered = allInquiries.filter((item) => {

        const searchableText = [

          item.name,
          item.customerName,
          item.mobile,
          item.phone,
          item.plan,
          item.selectedPlan,
          item.question,
          item.message,
          item.status

        ].join(" ").toLowerCase();

        return searchableText.includes(searchText);

      });

      displayInquiries(filtered);

    });

    document.getElementById("dashboardBtn").addEventListener("click", () => {
      window.location.href = "dashboard.html";
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {

      await signOut(auth);
      showLogin();

    });

  </script>

</body>
</html>
