<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Panel - Apna Growth Hub</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #eef4ff, #f8fbff);
      min-height: 100vh;
      color: #172033;
    }

    .header {
      background: linear-gradient(135deg, #102d72, #1769e0);
      color: white;
      padding: 28px 18px;
      text-align: center;
      border-radius: 0 0 30px 30px;
    }

    .header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.92;
    }

    .container {
      width: 94%;
      max-width: 1150px;
      margin: 25px auto;
    }

    .login-box,
    .admin-box {
      background: white;
      padding: 25px;
      border-radius: 22px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    .login-box {
      max-width: 430px;
      margin: 45px auto;
    }

    h2 {
      color: #123c91;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d9e1ef;
      border-radius: 10px;
      margin-bottom: 13px;
      font-size: 15px;
      outline: none;
      background: white;
    }

    input:focus,
    select:focus {
      border-color: #1769e0;
      box-shadow: 0 0 0 3px rgba(23, 105, 224, 0.10);
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.92;
    }

    .primary-btn {
      width: 100%;
      background: #1769e0;
      color: white;
    }

    .dashboard-btn {
      background: #123c91;
      color: white;
    }

    .refresh-btn {
      background: #0f766e;
      color: white;
    }

    .logout-btn {
      background: #d93025;
      color: white;
    }

    .message {
      margin-top: 12px;
      color: #d93025;
      font-size: 14px;
      line-height: 1.5;
    }

    .success-message {
      color: #15803d;
      font-size: 14px;
      margin-top: 10px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .count-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .count-card {
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.07);
      border-left: 5px solid #1769e0;
    }

    .count-card h3 {
      font-size: 14px;
      color: #555;
      margin-bottom: 10px;
    }

    .count-number {
      font-size: 32px;
      font-weight: bold;
      color: #123c91;
    }

    .pending {
      border-left-color: #f59e0b;
    }

    .pending .count-number {
      color: #d97706;
    }

    .contacted {
      border-left-color: #2563eb;
    }

    .contacted .count-number {
      color: #2563eb;
    }

    .completed {
      border-left-color: #16a34a;
    }

    .completed .count-number {
      color: #16a34a;
    }

    .search-row {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
    }

    .search-box {
      flex: 1;
      margin-bottom: 0;
    }

    .inquiry-list {
      display: grid;
      gap: 18px;
    }

    .inquiry-card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.07);
      border: 1px solid #e7edf7;
    }

    .inquiry-card h3 {
      color: #123c91;
      margin-bottom: 15px;
      font-size: 20px;
    }

    .customer-info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      margin-bottom: 15px;
    }

    .info-item {
      background: #f7faff;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #edf2fa;
      word-break: break-word;
    }

    .info-item strong {
      display: block;
      color: #123c91;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .info-item span {
      color: #333;
      font-size: 14px;
      line-height: 1.5;
    }

    .question-box {
      background: #fffaf0;
      border-left: 4px solid #f59e0b;
      padding: 13px;
      border-radius: 8px;
      margin-top: 12px;
      line-height: 1.6;
      font-size: 14px;
      word-break: break-word;
    }

    .question-box strong {
      color: #92400e;
    }

    .status-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 18px;
      padding-top: 15px;
      border-top: 1px solid #edf1f7;
    }

    .status-row select {
      width: auto;
      min-width: 150px;
      margin-bottom: 0;
    }

    .save-btn {
      background: #1769e0;
      color: white;
    }

    .whatsapp-btn {
      background: #16a34a;
      color: white;
    }

    .call-btn {
      background: #7c3aed;
      color: white;
    }

    .delete-btn {
      background: #d93025;
      color: white;
    }

    .status-message {
      width: 100%;
      color: #15803d;
      font-size: 13px;
      margin-top: 4px;
    }

    .empty {
      background: white;
      padding: 30px 20px;
      border-radius: 18px;
      text-align: center;
      color: #666;
      line-height: 1.6;
    }

    .hidden {
      display: none !important;
    }

    .footer {
      text-align: center;
      color: #777;
      font-size: 13px;
      padding: 25px 10px;
    }

    @media (max-width: 650px) {
      .header h1 {
        font-size: 23px;
      }

      .login-box,
      .admin-box {
        padding: 20px;
      }

      .top-actions {
        width: 100%;
      }

      .top-actions button {
        flex: 1;
      }

      .search-row {
        flex-direction: column;
        align-items: stretch;
      }

      .search-box {
        width: 100%;
      }

      .status-row {
        align-items: stretch;
        flex-direction: column;
      }

      .status-row select,
      .status-row button {
        width: 100%;
      }

      .customer-info {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Apna Growth Hub 🔐</h1>
    <p>Admin Panel | Virender Chauhan</p>
  </div>

  <div class="container">

    <!-- ADMIN LOGIN -->
    <div class="login-box" id="loginSection">

      <h2>Admin Login</h2>

      <p class="subtitle">
        केवल authorized Admin account से ही इस panel में login करें।
      </p>

      <input
        type="email"
        id="adminEmail"
        placeholder="Admin Email"
        autocomplete="email"
      >

      <input
        type="password"
        id="adminPassword"
        placeholder="Admin Password"
        autocomplete="current-password"
      >

      <button class="primary-btn" id="loginBtn">
        Login to Admin Panel
      </button>

      <p class="message" id="loginMessage"></p>

    </div>

    <!-- ADMIN PANEL -->
    <div class="admin-box hidden" id="adminSection">

      <div class="top-bar">

        <div>
          <h2>Customer Inquiries</h2>
          <p class="subtitle">
            सभी customer inquiries यहाँ manage करें।
          </p>
        </div>

        <div class="top-actions">

          <button class="dashboard-btn" id="dashboardBtn">
            Dashboard
          </button>

          <button class="refresh-btn" id="refreshBtn">
            Refresh
          </button>

          <button class="logout-btn" id="logoutBtn">
            Logout
          </button>

        </div>

      </div>

      <div class="count-grid">

        <div class="count-card">
          <h3>Total Inquiries</h3>
          <div class="count-number" id="totalCount">0</div>
        </div>

        <div class="count-card pending">
          <h3>Pending</h3>
          <div class="count-number" id="pendingCount">0</div>
        </div>

        <div class="count-card contacted">
          <h3>Contacted</h3>
          <div class="count-number" id="contactedCount">0</div>
        </div>

        <div class="count-card completed">
          <h3>Completed</h3>
          <div class="count-number" id="completedCount">0</div>
        </div>

      </div>

      <div class="search-row">

        <input
          class="search-box"
          type="text"
          id="searchInput"
          placeholder="Name, mobile, email, plan या question से search करें..."
        >

      </div>

      <div class="inquiry-list" id="inquiryList"></div>

    </div>

  </div>

  <div class="footer">
    © 2026 Apna Growth Hub | Virender Chauhan
  </div>

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getFirestore,
      collection,
      getDocs,
      updateDoc,
      deleteDoc,
      doc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBasu6SpOqvldxWEmTHs9WUSTXsK2qz-0w",
      authDomain: "apna-growth-hub.firebaseapp.com",
      projectId: "apna-growth-hub",
      storageBucket: "apna-growth-hub.firebasestorage.app",
      messagingSenderId: "939001251123",
      appId: "1:939001251123:web:f2966004acaa64186e2a46",
      measurementId: "G-GZGCHL4XQ3"
    };

    const ADMIN_UID = "bhpu24P8Ixfq0ZPSBsoLW3kd0dg1";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginSection = document.getElementById("loginSection");
    const adminSection = document.getElementById("adminSection");
    const loginMessage = document.getElementById("loginMessage");
    const inquiryList = document.getElementById("inquiryList");
    const searchInput = document.getElementById("searchInput");

    let allInquiries = [];

    onAuthStateChanged(auth, async (user) => {

      if (!user) {
        showLogin();
        return;
      }

      if (user.uid !== ADMIN_UID) {

        await signOut(auth);

        showLogin();

        loginMessage.textContent =
          "यह account Admin नहीं है। केवल Admin account से access मिलेगा।";

        return;
      }

      showAdmin();
      await loadInquiries();

    });

    function showLogin() {
      loginSection.classList.remove("hidden");
      adminSection.classList.add("hidden");
    }

    function showAdmin() {
      loginSection.classList.add("hidden");
      adminSection.classList.remove("hidden");
    }

    document.getElementById("loginBtn").addEventListener("click", async () => {

      const email = document.getElementById("adminEmail").value.trim();
      const password = document.getElementById("adminPassword").value;

      loginMessage.textContent = "";

      if (!email || !password) {
        loginMessage.textContent =
          "Email और password दोनों भरें।";
        return;
      }

      try {

        const result = await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        if (result.user.uid !== ADMIN_UID) {

          await signOut(auth);

          loginMessage.textContent =
            "यह account Admin नहीं है।";

          return;
        }

        loginMessage.textContent = "";

      } catch (error) {

        console.error("Login error:", error);

        loginMessage.textContent =
          "Admin login नहीं हुआ। Email या password check करें।";

      }

    });

    async function loadInquiries() {

      inquiryList.innerHTML = `
        <div class="empty">
          Inquiries load हो रही हैं...
        </div>
      `;

      try {

        const snapshot =
          await getDocs(collection(db, "inquiries"));

        allInquiries = [];

        snapshot.forEach((item) => {

          allInquiries.push({
            id: item.id,
            ...item.data()
          });

        });

        allInquiries.sort((a, b) => {

          const dateA = getDateValue(a);
          const dateB = getDateValue(b);

          return dateB - dateA;

        });

        updateCounts();
        displayInquiries(allInquiries);

      } catch (error) {

        console.error("Load inquiries error:", error);

        inquiryList.innerHTML = "";

        const errorBox = document.createElement("div");
        errorBox.className = "empty";
        errorBox.textContent =
          "Inquiries load नहीं हो पाईं। Firestore rules और Admin UID check करें।";

        inquiryList.appendChild(errorBox);

      }

    }

    function getDateValue(item) {

      const value =
        item.date ||
        item.createdAt ||
        item.timestamp ||
        "";

      const parsed = new Date(value).getTime();

      if (Number.isNaN(parsed)) {
        return 0;
      }

      return parsed;

    }

    function updateCounts() {

      let total = allInquiries.length;
      let pending = 0;
      let contacted = 0;
      let completed = 0;

      allInquiries.forEach((item) => {

        const status = item.status || "Pending";

        if (status === "Pending") {
          pending++;
        }

        if (status === "Contacted") {
          contacted++;
        }

        if (status === "Completed") {
          completed++;
        }

      });

      document.getElementById("totalCount").textContent = total;
      document.getElementById("pendingCount").textContent = pending;
      document.getElementById("contactedCount").textContent = contacted;
      document.getElementById("completedCount").textContent = completed;

    }

    function createInfoItem(label, value) {

      const box = document.createElement("div");
      box.className = "info-item";

      const strong = document.createElement("strong");
      strong.textContent = label;

      const span = document.createElement("span");
      span.textContent = value || "Not available";

      box.appendChild(strong);
      box.appendChild(span);

      return box;

    }

    function displayInquiries(inquiries) {

      inquiryList.innerHTML = "";

      if (inquiries.length === 0) {

        const emptyBox = document.createElement("div");
        emptyBox.className = "empty";
        emptyBox.textContent = "कोई inquiry नहीं मिली।";

        inquiryList.appendChild(emptyBox);
        return;

      }

      inquiries.forEach((item) => {

        const card = document.createElement("div");
        card.className = "inquiry-card";

        const customerName =
          item.name ||
          item.customerName ||
          "Unknown Customer";

        const mobile =
          item.mobile ||
          item.phone ||
          "";

        const email =
          item.email ||
          item.customerEmail ||
          "";

        const plan =
          item.plan ||
          item.selectedPlan ||
          "Not selected";

        const question =
          item.question ||
          item.message ||
          "No question";

        const date =
          item.date ||
          item.createdAt ||
          "Not available";

        const statusText =
          item.status ||
          "Pending";

        const title = document.createElement("h3");
        title.textContent = "👤 " + customerName;

        const customerInfo = document.createElement("div");
        customerInfo.className = "customer-info";

        customerInfo.appendChild(
          createInfoItem("📱 Mobile", mobile)
        );

        customerInfo.appendChild(
          createInfoItem("📧 Email", email)
        );

        customerInfo.appendChild(
          createInfoItem("📋 Plan", plan)
        );

        customerInfo.appendChild(
          createInfoItem("📅 Date", date)
        );

        const questionBox = document.createElement("div");
        questionBox.className = "question-box";

        const questionStrong = document.createElement("strong");
        questionStrong.textContent = "Question: ";

        const questionText = document.createElement("span");
        questionText.textContent = question;

        questionBox.appendChild(questionStrong);
        questionBox.appendChild(questionText);

        const statusRow = document.createElement("div");
        statusRow.className = "status-row";

        const statusSelect = document.createElement("select");

        const statuses = [
          "Pending",
          "Contacted",
          "Completed"
        ];

        statuses.forEach((status) => {

          const option = document.createElement("option");

          option.value = status;
          option.textContent = status;

          if (status === statusText) {
            option.selected = true;
          }

          statusSelect.appendChild(option);

        });

        const saveButton = document.createElement("button");
        saveButton.className = "save-btn";
        saveButton.textContent = "Save Status";

        const statusMessage = document.createElement("div");
        statusMessage.className = "status-message";

        saveButton.addEventListener("click", async () => {

          saveButton.disabled = true;
          saveButton.textContent = "Saving...";

          try {

            await updateDoc(
              doc(db, "inquiries", item.id),
              {
                status: statusSelect.value
              }
            );

            item.status = statusSelect.value;

            updateCounts();

            statusMessage.textContent =
              "Status successfully saved.";

          } catch (error) {

            console.error("Status update error:", error);

            statusMessage.textContent =
              "Status save नहीं हुआ।";

          }

          saveButton.disabled = false;
          saveButton.textContent = "Save Status";

        });

        const whatsappButton = document.createElement("button");
        whatsappButton.className = "whatsapp-btn";
        whatsappButton.textContent = "WhatsApp";

        whatsappButton.addEventListener("click", () => {

          let mobileNumber =
            String(mobile).replace(/\D/g, "");

          if (mobileNumber.length === 10) {
            mobileNumber = "91" + mobileNumber;
          }

          if (!mobileNumber) {
            alert("Customer mobile number उपलब्ध नहीं है।");
            return;
          }

          const message =
            "नमस्ते " +
            customerName +
            " जी, Apna Growth Hub से आपकी LIC inquiry के संबंध में संपर्क कर रहा हूँ।";

          const whatsappUrl =
            "https://wa.me/" +
            mobileNumber +
            "?text=" +
            encodeURIComponent(message);

          window.open(whatsappUrl, "_blank");

        });

        const callButton = document.createElement("button");
        callButton.className = "call-btn";
        callButton.textContent = "Call";

        callButton.addEventListener("click", () => {

          const cleanMobile =
            String(mobile).replace(/\D/g, "");

          if (!cleanMobile) {
            alert("Customer mobile number उपलब्ध नहीं है।");
            return;
          }

          window.location.href =
            "tel:" + cleanMobile;

        });

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-btn";
        deleteButton.textContent = "Delete";

        deleteButton.addEventListener("click", async () => {

          const confirmDelete = confirm(
            "क्या आप इस inquiry को permanently delete करना चाहते हैं?"
          );

          if (!confirmDelete) {
            return;
          }

          deleteButton.disabled = true;
          deleteButton.textContent = "Deleting...";

          try {

            await deleteDoc(
              doc(db, "inquiries", item.id)
            );

            await loadInquiries();

          } catch (error) {

            console.error("Delete error:", error);

            alert("Inquiry delete नहीं हुई।");

            deleteButton.disabled = false;
            deleteButton.textContent = "Delete";

          }

        });

        statusRow.appendChild(statusSelect);
        statusRow.appendChild(saveButton);
        statusRow.appendChild(whatsappButton);
        statusRow.appendChild(callButton);
        statusRow.appendChild(deleteButton);
        statusRow.appendChild(statusMessage);

        card.appendChild(title);
        card.appendChild(customerInfo);
        card.appendChild(questionBox);
        card.appendChild(statusRow);

        inquiryList.appendChild(card);

      });

    }

    searchInput.addEventListener("input", () => {

      const searchText =
        searchInput.value.toLowerCase().trim();

      const filtered = allInquiries.filter((item) => {

        const searchableText = [

          item.name,
          item.customerName,
          item.mobile,
          item.phone,
          item.email,
          item.customerEmail,
          item.plan,
          item.selectedPlan,
          item.question,
          item.message,
          item.status,
          item.date,
          item.createdAt

        ].join(" ").toLowerCase();

        return searchableText.includes(searchText);

      });

      displayInquiries(filtered);

    });

    document.getElementById("refreshBtn").addEventListener("click", () => {
      loadInquiries();
    });

    document.getElementById("dashboardBtn").addEventListener("click", () => {
      window.location.href = "dashboard.html";
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {

      await signOut(auth);
      showLogin();

    });

  </script>

</body>
</html>
